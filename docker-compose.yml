version: "3.9"

services:
  app:
    build: .
    container_name: nextjs_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/myapp
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - /srv/mongodb:/data/db
    environment:
      MONGO_INITDB_DATABASE: myapp
